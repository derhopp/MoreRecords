name: Publish one-time 0.1.0b2 prerelease

# Only CI-green commits on main with the exact release-preparation subject may
# create the tag. Earlier 0.1.0b1 and later unrelated commits are unaffected.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish 0.1.0b2 as prerelease from the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" != "chore: prepare prerelease 0.1.0b2" ]]; then
            echo "Not the one-time beta 2 release preparation commit; skipping."
            exit 0
          fi
          version="$(python -c 'import json; print(json.load(open("custom_components/more_records/manifest.json"))["version"])')"
          if [[ "$version" != "0.1.0b2" ]]; then
            echo "Manifest version is $version, expected 0.1.0b2"
            exit 1
          fi
          if gh release view "0.1.0b2" --repo "$REPO" >/dev/null 2>&1; then
            echo "Pre-release 0.1.0b2 exists already; it will not be changed."
            exit 0
          fi
          gh release create "0.1.0b2" \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --title "MoreRecords 0.1.0b2 (Beta 2)" \
            --notes-file "docs/releases/0.1.0b2.md" \
            --prerelease \
            --latest=false
          echo "Published beta 2 prerelease for $TARGET_SHA"
