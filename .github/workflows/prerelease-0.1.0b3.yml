name: Publish 0.1.0b3 prerelease after green CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only the reviewed beta preparation commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" != "chore: prepare prerelease 0.1.0b3" ]]; then
            echo "Not the beta preparation commit; skipping."
            exit 0
          fi
          version="$(python -c 'import json; print(json.load(open("custom_components/more_records/manifest.json"))["version"])')"
          if [[ "$version" != "0.1.0b3" ]]; then
            echo "Manifest version is $version, expected 0.1.0b3"
            exit 1
          fi
          if gh release view "0.1.0b3" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; not changing it."
            exit 0
          fi
          gh release create "0.1.0b3" \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --title "MoreRecords 0.1.0b3 (Beta 3)" \
            --notes-file "docs/releases/0.1.0b3.md" \
            --prerelease \
            --latest=false
          echo "Published 0.1.0b3 for $TARGET_SHA"
